  <body>
    <div id="root"></div>
    <!--
      A physical entry point, separate from the public story.

      The dashboard is a client-side route inside the single-page app, which is
      why it works under the Express server: that server falls back to
      index.html for any unmatched path. A static host has no such fallback, so
      it 404s on /admin. Emitting a real admin/index.html means /admin resolves
      to a file on every static host — Vercel, Netlify, Cloudflare Pages and
      GitHub Pages all serve a directory's index.html — with no host-specific
      rewrite rules to keep in sync.
    -->
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
